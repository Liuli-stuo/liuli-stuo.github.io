name: Sync game files (manual seed)

on:
  workflow_dispatch:
  push:
    paths:
      - sync.trigger

permissions:
  contents: write

concurrency:
  group: sync-game
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        run: |
          curl -fsSL --retry 3 -o index.html "https://aka.doubaocdn.com/s/s9jKif0WGC"
          curl -fsSL --retry 3 -o offline.html "https://aka.doubaocdn.com/s/1Bg1AoTNeC"
          mkdir -p demo
          curl -fsSL --retry 3 -o demo/index.html "https://aka.doubaocdn.com/s/dIIegVmjP2"
          curl -fsSL --retry 3 -o demo/full.html "https://aka.doubaocdn.com/s/UOdsOqfc5V"
          touch .nojekyll
          ls -lh index.html offline.html demo/index.html demo/full.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html offline.html .nojekyll demo/index.html demo/full.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync game build"
            git push
          fi
