name: Sync game files

on:
  workflow_dispatch:
  push:
    paths:
      - sync.trigger

permissions:
  contents: write

concurrency:
  group: sync-game
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o index.html "https://aka.doubaocdn.com/s/JvU3DQz6i9"
          curl -fsSL --retry 3 -o offline.html "https://aka.doubaocdn.com/s/yirOosUyzG"
          mkdir -p demo
          curl -fsSL --retry 3 -o demo/index.html "https://aka.doubaocdn.com/s/Pu9JGt5NlU"
          curl -fsSL --retry 3 -o demo/full.html "https://aka.doubaocdn.com/s/JxCMq22F8R"
          test -s index.html
          test -s offline.html
          test -s demo/index.html
          test -s demo/full.html
          grep -q "请遵守规则" index.html
          grep -q "请遵守规则" offline.html
          grep -q "请遵守规则" demo/index.html
          grep -q "请遵守规则" demo/full.html
          touch .nojekyll
          ls -lh index.html offline.html demo/index.html demo/full.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html offline.html .nojekyll demo/index.html demo/full.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync P0P2 game builds"
            git push
          fi
