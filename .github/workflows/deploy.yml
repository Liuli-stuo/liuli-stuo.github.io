name: Sync game files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-game
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        run: |
          curl -fsSL --retry 3 -o index.html "https://aka.doubaocdn.com/s/IUGzDUzl6e"
          curl -fsSL --retry 3 -o offline.html "https://aka.doubaocdn.com/s/f1mScgEE7H"
          touch .nojekyll
          ls -lh index.html offline.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html offline.html .nojekyll
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync game build"
            git push
          fi
